<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Kuis Campuran</title>
    <link rel="stylesheet" href="../aset/bagian.css" />
    <style>
      .area {
        --accent: #fb923c;
      }
      .area.out > * {
        animation: keluar 0.6s cubic-bezier(0.5, 0, 0.8, 0.3) forwards;
      }

      /* baris atas */
      .atas {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        animation: masuk 0.8s cubic-bezier(0.2, 0.9, 0.25, 1) backwards;
      }
      .lencana {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        padding: 10px 30px 10px 18px;
        border-radius: 44px;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #07101f;
        background: var(--k);
      }
      .lencana b {
        font-size: 32px;
        font-weight: 400;
      }
      .nomor {
        font-size: 30px;
        font-weight: 800;
        color: var(--mut);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.04em;
      }
      .nomor em {
        font-style: normal;
        color: #fff;
      }
      .timer {
        position: relative;
        width: 86px;
        height: 86px;
      }
      .timer svg {
        width: 86px;
        height: 86px;
        transform: rotate(-90deg);
      }
      .timer circle {
        fill: none;
        stroke-width: 9;
      }
      .timer .dasar {
        stroke: rgba(255, 255, 255, 0.14);
      }
      .timer .isi {
        stroke: var(--accent);
        stroke-linecap: round;
        stroke-dasharray: 238.76;
        stroke-dashoffset: 0;
        filter: drop-shadow(0 0 8px var(--accent));
      }
      .timer span {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 36px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .timer.habis .isi {
        stroke: #34d399;
      }

      /* soal */
      .soal {
        position: absolute;
        left: 0;
        right: 0;
        top: 84px;
        height: 172px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 60px;
        text-align: center;
        font-size: 56px;
        line-height: 1.25;
        font-weight: 800;
        letter-spacing: -0.8px;
        animation: masuk 0.9s 0.1s cubic-bezier(0.2, 0.9, 0.25, 1) backwards;
      }

      /* pilihan */
      .pilihan {
        position: absolute;
        left: 0;
        right: 0;
        top: 274px;
        height: 254px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 20px 26px;
      }
      .op {
        display: flex;
        align-items: center;
        gap: 24px;
        padding: 0 28px 0 20px;
        border-radius: 28px;
        background: linear-gradient(
          160deg,
          rgba(255, 255, 255, 0.12),
          rgba(255, 255, 255, 0.035)
        );
        border: 1.5px solid rgba(255, 255, 255, 0.14);
        transition:
          transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1),
          opacity 0.6s,
          box-shadow 0.6s,
          background 0.6s,
          border-color 0.6s;
        animation: masuk 0.8s cubic-bezier(0.2, 0.9, 0.25, 1) backwards;
        animation-delay: calc(var(--i) * 0.12s + 0.5s);
      }
      .op-huruf {
        flex: none;
        width: 72px;
        height: 72px;
        border-radius: 22px;
        display: grid;
        place-items: center;
        font-size: 38px;
        font-weight: 800;
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        transition: all 0.5s;
      }
      .op-teks {
        font-size: 38px;
        font-weight: 700;
        line-height: 1.15;
      }
      .op-tanda {
        margin-left: auto;
        font-size: 44px;
        opacity: 0;
        transform: scale(0.4);
        transition: all 0.5s;
      }
      .pilihan.buka .op:not(.benar) {
        opacity: 0.38;
        transform: scale(0.97);
      }
      .op.benar {
        background: linear-gradient(
          160deg,
          rgba(52, 211, 153, 0.4),
          rgba(52, 211, 153, 0.12)
        );
        border-color: #34d399;
        box-shadow:
          0 0 0 2px #34d399,
          0 24px 70px -18px #34d399;
        transform: scale(1.03);
      }
      .op.benar .op-huruf {
        background: #34d399;
        color: #04140d;
      }
      .op.benar .op-tanda {
        opacity: 1;
        transform: none;
      }

      /* penjelasan */
      .jawab {
        position: absolute;
        left: 0;
        right: 0;
        top: 548px;
        height: 88px;
        display: flex;
        align-items: center;
        gap: 24px;
        padding: 0 36px;
        border-radius: 28px;
        background: rgba(52, 211, 153, 0.14);
        border: 1.5px solid rgba(52, 211, 153, 0.5);
        opacity: 0;
        transform: translateY(26px);
        transition: all 0.6s cubic-bezier(0.2, 0.9, 0.25, 1);
      }
      .jawab.tampil {
        opacity: 1;
        transform: none;
      }
      .jawab-ikon {
        flex: none;
        font-size: 44px;
      }
      .jawab b {
        display: block;
        font-size: 20px;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: #34d399;
        margin-bottom: 2px;
      }
      .jawab span {
        font-size: 27px;
        line-height: 1.28;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <section class="title" id="title">
      <div>
        <div class="kicker" id="kicker"></div>
        <h1 id="tTitle"></h1>
        <p id="tSub"></p>
      </div>
      <div class="t-ar" id="tAr" lang="ar" dir="rtl"></div>
    </section>
    <div class="progress"><i id="bar"></i></div>
    <main class="area" id="area"></main>

    <script src="../aset/bagian.js"></script>
    <script>
      /* =====================================================================
   KUIS CAMPURAN: ILMU AGAMA + ILMU UMUM
   Cara update: ubah / tambah / hapus blok { ... } di DATA di bawah ini.
     kategori  : 'agama' atau 'umum'
     soal      : teks pertanyaan (usahakan maks. ±90 karakter)
     pilihan   : tepat 4 pilihan jawaban (urutan A, B, C, D)
     benar     : nomor jawaban yang benar -> 0 = A, 1 = B, 2 = C, 3 = D
     penjelasan: satu kalimat penjelasan (tampil setelah jawaban dibuka)
   Contoh di bawah hanyalah contoh — silakan ganti sesuai kebutuhan.
   ===================================================================== */
      const WAKTU_SOAL = 12; // detik untuk berpikir sebelum jawaban dibuka
      const WAKTU_JAWABAN = 7; // detik jawaban + penjelasan ditampilkan

      const DATA = [
        {
          kategori: "agama",
          soal: "Apa itu sholat secara bahasa?",
          pilihan: ["Menahan diri", "Bersuci", "Doa", "Berkunjung"],
          benar: 2,
          penjelasan:
            "Sholat berarti doa. Secara istilah: ibadah berupa ucapan dan gerakan, diawali takbir dan diakhiri salam.",
        },

        {
          kategori: "agama",
          soal: "Apa itu puasa secara bahasa?",
          pilihan: ["Doa", "Menahan diri", "Bersedekah", "Berserah diri"],
          benar: 1,
          penjelasan: "Puasa (shaum) secara bahasa berarti menahan diri.",
        },

        {
          kategori: "agama",
          soal: "Apa itu puasa secara istilah?",
          pilihan: [
            "Tidak berbicara selama sehari penuh",
            "Tidak makan dan minum siang dan malam",
            "Tidak makan dan minum sampai waktu Dzuhur",
            "Menahan pembatal puasa dari fajar sampai maghrib",
          ],
          benar: 3,
          penjelasan:
            "Puasa menurut istilah: menahan diri dari pembatalnya sejak fajar hingga matahari terbenam, dengan niat karena Allah.",
        },

        {
          kategori: "agama",
          soal: "Apa hukum berhaji?",
          pilihan: [
            "Wajib sekali seumur hidup bagi yang mampu",
            "Sunnah bagi setiap muslim",
            "Wajib setiap tahun bagi yang mampu",
            "Mubah (boleh dilakukan atau ditinggalkan)",
          ],
          benar: 0,
          penjelasan:
            "Haji adalah rukun Islam kelima, wajib sekali seumur hidup bagi yang mampu (QS. Ali Imran: 97).",
        },

        {
          kategori: "umum",
          soal: "Bulan apa yang memiliki 28 hari?",
          pilihan: [
            "Hanya bulan Februari",
            "Semua bulan",
            "Hanya bulan Januari",
            "Tidak ada satu pun",
          ],
          benar: 1,
          penjelasan:
            "Semua bulan memiliki 28 hari atau lebih. Yang “hanya” 28 hari adalah Februari pada tahun biasa (bukan kabisat).",
        },

        {
          kategori: "umum",
          soal: "Apa itu internet?",
          pilihan: [
            "Program untuk menulis dokumen",
            "Alat untuk menyimpan data di komputer",
            "Jaringan global penghubung komputer sedunia",
            "Aplikasi khusus untuk mengirim pesan",
          ],
          benar: 2,
          penjelasan:
            "Internet (interconnection networking): jaringan global yang menghubungkan jutaan perangkat untuk bertukar data.",
        },

        {
          kategori: "umum",
          soal: "Apa itu website?",
          pilihan: [
            "Kabel yang menghubungkan seluruh dunia",
            "Perangkat keras untuk menyimpan data",
            "Program untuk mengetik dokumen",
            "Kumpulan halaman web yang dibuka lewat browser",
          ],
          benar: 3,
          penjelasan:
            "Website adalah kumpulan halaman web beralamat URL yang dibuka lewat browser. Internet jaringannya, website isinya.",
        },

        {
          kategori: "umum",
          soal: "Apa itu komputer?",
          pilihan: [
            "Mesin elektronik yang mengolah data jadi informasi",
            "Alat tulis untuk menggambar",
            "Jaringan yang menghubungkan dunia",
            "Kumpulan halaman web",
          ],
          benar: 0,
          penjelasan:
            "Komputer menerima data (input), memprosesnya, menyimpannya, lalu menghasilkan informasi (output).",
        },
      ];
      /* ---------------- kode tampilan (tidak perlu diubah) ---------------- */
      const { $, esc, pad, wait } = Mading;
      Mading.init({ warna: "#fb923c", judul: "Kuis" });
      const KAT = {
        agama: { nama: "Ilmu Agama", ikon: "🕌", warna: "#34d399" },
        umum: { nama: "Ilmu Umum", ikon: "🌍", warna: "#38bdf8" },
      };
      const HURUF = ["A", "B", "C", "D"];
      const KELILING = 238.76;

      Mading.mulai(async () => {
        Mading.judul({
          kicker: "Bagian 04",
          judul: "Kuis Campuran",
          sub: "Ilmu agama dan ilmu umum",
          arab: "مُسَابَقَةٌ",
        });
        Mading.bar(DATA.length * (WAKTU_SOAL + WAKTU_JAWABAN) * 1000);
        const area = $("area");

        for (let i = 0; i < DATA.length; i++) {
          const d = DATA[i],
            k = KAT[d.kategori] || KAT.umum;
          area.classList.remove("out");
          area.innerHTML = `
      <div class="atas">
        <div class="lencana" style="--k:${k.warna}"><b>${k.ikon}</b>${k.nama}</div>
        <div class="nomor">Soal <em>${pad(i + 1)}</em> / ${pad(DATA.length)}</div>
        <div class="timer" id="timer">
          <svg viewBox="0 0 86 86"><circle class="dasar" cx="43" cy="43" r="38"/><circle class="isi" id="isi" cx="43" cy="43" r="38"/></svg>
          <span id="detik">${WAKTU_SOAL}</span>
        </div>
      </div>
      <div class="kartu soal">${esc(d.soal)}</div>
      <div class="pilihan" id="pilihan">
        ${d.pilihan
          .map(
            (p, j) => `
          <div class="op" style="--i:${j}" id="op${j}">
            <div class="op-huruf">${HURUF[j]}</div>
            <div class="op-teks">${esc(p)}</div>
            <div class="op-tanda">✅</div>
          </div>`,
          )
          .join("")}
      </div>
      <div class="jawab" id="jawab">
        <div class="jawab-ikon">🎯</div>
        <div><b>Jawaban: ${HURUF[d.benar]}. ${esc(d.pilihan[d.benar])}</b><span>${esc(d.penjelasan)}</span></div>
      </div>`;

          /* hitung mundur */
          const isi = $("isi"),
            detik = $("detik");
          const t0 = Date.now(),
            total = WAKTU_SOAL * 1000;
          await new Promise((res) => {
            const iv = setInterval(() => {
              const sisa = Math.max(0, total - (Date.now() - t0));
              isi.style.strokeDashoffset = KELILING * (1 - sisa / total);
              detik.textContent = Math.ceil(sisa / 1000);
              if (sisa <= 0) {
                clearInterval(iv);
                res();
              }
            }, 100);
          });

          /* buka jawaban */
          $("timer").classList.add("habis");
          detik.textContent = "✓";
          $("pilihan").classList.add("buka");
          $("op" + d.benar).classList.add("benar");
          $("jawab").classList.add("tampil");
          await wait(WAKTU_JAWABAN * 1000 - 700);
          area.classList.add("out");
          await wait(700);
        }
        Mading.selesai();
      });
    </script>
  </body>
</html>
