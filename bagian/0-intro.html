<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Intro PIAT 12 RIAU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
/* VERSI RINGAN: semua gerakan memakai opacity & transform (dikerjakan GPU),
   tanpa blur, mask, blend-mode, clip-path, bayangan buram, dan animasi ukuran huruf. */
:root{ --k:1; --hijau:#029a65; --lime:#c3e161; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#fff;cursor:none}
html.standalone,html.standalone body{width:100%;height:100%}
body{position:relative;font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif}
#kanvas{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:#fff}

/* ===== LATAR: gradasi statis hijau–lime, ditutup layar putih yang memudar ===== */
.lapis{position:absolute;inset:0}
#warna{
  background:
    radial-gradient(62% 72% at 12% 8%,  rgba(195,225,97,.95), rgba(195,225,97,0) 70%),
    radial-gradient(56% 66% at 92% 96%, rgba(2,154,101,.95),  rgba(2,154,101,0) 70%),
    radial-gradient(46% 56% at 46% 36%, rgba(150,205,90,.80), rgba(150,205,90,0) 70%),
    linear-gradient(135deg,var(--hijau) 0%,var(--lime) 100%);
}
#warna2{          /* hanya dipakai bila BG_BERGERAK = true */
  display:none;opacity:0;
  background:
    radial-gradient(62% 72% at 88% 10%, rgba(195,225,97,.95), rgba(195,225,97,0) 70%),
    radial-gradient(56% 66% at 8% 94%,  rgba(2,154,101,.95),  rgba(2,154,101,0) 70%),
    radial-gradient(46% 56% at 56% 64%, rgba(150,205,90,.80), rgba(150,205,90,0) 70%),
    linear-gradient(315deg,var(--hijau) 0%,var(--lime) 100%);
}
#warna2.hidup{display:block;animation:silang 12s ease-in-out infinite alternate}
@keyframes silang{from{opacity:0}to{opacity:1}}
#putih{background:#fff;opacity:1;transition:opacity calc(var(--k)*1800ms) ease}
#putih.hilang{opacity:0}

/* ===== FOTO (sudah dilembutkan tepinya lewat canvas, jadi hanya bitmap biasa) ===== */
.foto{position:absolute;opacity:0;transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(.92);
  transition:opacity calc(var(--k)*2600ms) ease,transform calc(var(--k)*3400ms) cubic-bezier(.2,.7,.2,1)}
.foto.tampil{opacity:var(--o,.62);transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(1)}
.foto canvas{display:block;width:100%;height:100%}

/* ===== TEKS ===== */
#skala{position:absolute;left:50%;top:46%;transform-origin:50% 50%;
  transition:transform calc(var(--k)*1300ms) cubic-bezier(.2,.8,.2,1)}
.judul{display:flex;align-items:flex-end;width:max-content;white-space:nowrap;line-height:1.15;
  font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#0b4a35;
  transition:color calc(var(--k)*1200ms) ease}
.judul.putih{color:#fff;text-shadow:0 3px 0 rgba(0,80,50,.28)}
.kata{display:inline-flex;align-items:flex-end;opacity:0}
.h,.x{display:inline-block}
.judul.mulai .kata{animation:masuk calc(var(--k)*800ms) cubic-bezier(.2,.9,.25,1) forwards;
  animation-delay:calc(var(--n)*var(--k)*90ms + var(--k)*300ms)}
@keyframes masuk{from{opacity:0;transform:translateY(.5em)}to{opacity:1;transform:none}}
.sp{display:inline-block;width:.34em;height:1em}
.x{overflow:hidden;white-space:nowrap;transition:width calc(var(--k)*800ms) cubic-bezier(.65,0,.35,1),opacity calc(var(--k)*500ms) ease}
.x.pergi{width:0!important;opacity:0!important}

#subwrap{position:absolute;left:0;right:0;top:calc(46% + 92px);height:104px;overflow:hidden;z-index:5}
#sub{display:block;padding-top:14px;line-height:1.35;font-size:62px;font-weight:700;letter-spacing:.14em;color:#f6ffd2;text-align:center;
  text-shadow:0 2px 0 rgba(0,80,50,.25);
  transform:translateY(115%);transition:transform calc(var(--k)*1200ms) cubic-bezier(.2,.9,.25,1)}
#subwrap.naik #sub{transform:none}
#pusat{position:absolute;inset:0;z-index:5}
</style>
</head>
<body>
<div id="kanvas">
  <div class="lapis" id="warna"></div>
  <div class="lapis" id="warna2"></div>
  <div id="fotoWadah"></div>
  <div class="lapis" id="putih"></div>
  <div id="pusat">
    <div id="skala"><div class="judul" id="judul"></div></div>
    <div id="subwrap"><span id="sub"></span></div>
  </div>
</div>

<script>
/* =====================================================================
   INTRO / PEMISAH (VERSI RINGAN)  —  PESANTREN ISLAM AL IRSYAD TENGARAN 12 RIAU  →  PIAT 12 RIAU
   Section layar penuh. Letakkan di daftar BAGIAN paling depan dengan penuh:true.

   Urutan animasi:
     putih + tulisan lengkap → latar hijau–lime muncul → 3 foto muncul halus
     → huruf selain "PIAT" menghilang → "PIAT 12 RIAU" membesar
     → "Majalah Digital" naik dari balik tulisan.
   ===================================================================== */

/* ---------- TEKS ---------- */
// simpan : berapa huruf DEPAN yang dipertahankan (99 = semua)
// jaga   : true = spasi setelah kata ini dipertahankan
const KATA = [
  { t:'PESANTREN', simpan:1 },
  { t:'ISLAM',     simpan:1 },
  { t:'AL',        simpan:1 },
  { t:'IRSYAD',    simpan:0 },
  { t:'TENGARAN',  simpan:1, jaga:true },
  { t:'12',        simpan:99, jaga:true },
  { t:'RIAU',      simpan:99 }
];
const SUB = 'Majalah Digital';

/* ---------- FOTO (3 foto; simpan di folder "foto" sejajar folder "bagian") ----------
   x, y   : posisi pusat foto dalam % layar        lebar : lebar foto (piksel, rasio 3:2)
   miring : derajat putaran                         o     : kepekatan foto 0–1
   muncul : detik ke berapa foto mulai muncul       */
const FOTO = [
  { src:'../foto/foto1.jpg', x:15, y:25, lebar:900, miring:-4, o:.62, muncul:4.2 },
  { src:'../foto/foto2.jpg', x:86, y:32, lebar:880, miring: 3, o:.62, muncul:5.4 },
  { src:'../foto/foto3.jpg', x:50, y:88, lebar:980, miring:-2, o:.62, muncul:6.6 }
];

/* ---------- WAKTU (detik sejak mulai) ---------- */
const T = {
  warna   : 2.4,    // layar putih memudar -> latar hijau–lime
  ringkas : 7.6,    // huruf selain PIAT menghilang
  besar   : 10.2,   // tulisan membesar
  sub     : 11.2,   // "Majalah Digital" naik
  selesai : 14.5    // intro berakhir -> lanjut ke bagian berikutnya
};
const KECEPATAN   = 1;      // 1 = normal, 1.3 = lebih cepat, 0.8 = lebih lambat
const BG_BERGERAK = false;  // true = latar bergeser warna pelan (lebih cantik, tetapi lebih berat untuk TV lemah)
const UKURAN_AKHIR = 168;   // ukuran huruf "PIAT 12 RIAU" setelah membesar (piksel)

/* ---------------- kode animasi (tidak perlu diubah) ---------------- */
const K = 1 / KECEPATAN;
const standalone = window.parent === window;
const $ = id => document.getElementById(id);
const kirim = o => { if(!standalone){ try{ parent.postMessage(Object.assign({mading:true},o),'*'); }catch(e){} } };
document.documentElement.style.setProperty('--k', K);

function skala(){
  const s = Math.min(innerWidth/1920, innerHeight/1080);
  $('kanvas').style.transform = `translate(${(innerWidth-1920*s)/2}px,${(innerHeight-1080*s)/2}px) scale(${s})`;
}
if(standalone){ document.documentElement.classList.add('standalone'); skala(); addEventListener('resize', skala); }
addEventListener('keydown', e => kirim({type:'tombol', key:e.key}));
kirim({type:'siap', warna:'#029a65', judul:'Intro'});

const judul = $('judul'), sk = $('skala');
const POSISI = s => `translate(-50%,-50%) scale(${s})`;

function bangun(){
  KATA.forEach((k,i)=>{
    const w = document.createElement('span'); w.className = 'kata'; w.style.setProperty('--n', i);
    const depan = k.t.slice(0, k.simpan), sisa = k.t.slice(k.simpan);
    if(depan){ const h = document.createElement('span'); h.className = 'h'; h.textContent = depan; w.appendChild(h); }
    if(sisa){  const x = document.createElement('span'); x.className = 'x'; x.textContent = sisa; w.appendChild(x); }
    judul.appendChild(w);
    if(i < KATA.length-1){
      const sp = document.createElement('span'); sp.className = 'sp' + (k.jaga ? '' : ' x'); judul.appendChild(sp);
    }
  });
}
/* Teks disusun pada ukuran AKHIR (tajam), lalu diperkecil dengan transform agar muat di layar.
   Membesar = hanya transform (ringan, tetap tajam). */
function ukurDanKecilkan(){
  judul.style.fontSize = UKURAN_AKHIR + 'px';
  sk.style.transition = 'none'; sk.style.transform = POSISI(1);
  judul.querySelectorAll('.x').forEach(el => { el.style.width = el.getBoundingClientRect().width + 'px'; });
  const lebar = judul.getBoundingClientRect().width;
  sk.style.transform = POSISI(Math.min(1, 1720 / lebar));
  void sk.offsetWidth; sk.style.transition = '';
}
/* Foto: tepi dilembutkan SEKALI di canvas (bukan mask CSS yang berat). */
function bangunFoto(){
  const wadah = $('fotoWadah');
  return FOTO.map(f=>{
    const d = document.createElement('div'); d.className = 'foto';
    const tinggi = f.lebar * 2/3;
    d.style.cssText = `left:${f.x}%;top:${f.y}%;width:${f.lebar}px;height:${tinggi}px;--r:${f.miring||0}deg;--o:${f.o||.6}`;
    const im = new Image();
    im.onerror = () => d.remove();                        // foto belum ada -> lewati
    im.onload = () => {
      const c = document.createElement('canvas'); c.width = 600; c.height = 400;
      const g = c.getContext('2d');
      const sc = Math.max(600/im.naturalWidth, 400/im.naturalHeight);
      const w = im.naturalWidth*sc, h = im.naturalHeight*sc;
      g.drawImage(im, (600-w)/2, (400-h)/2, w, h);
      g.globalCompositeOperation = 'destination-in';      // tepi memudar halus
      g.save(); g.translate(300,200); g.scale(300,200);
      const r = g.createRadialGradient(0,0,0,0,0,1);
      r.addColorStop(0,'rgba(0,0,0,1)'); r.addColorStop(.34,'rgba(0,0,0,1)');
      r.addColorStop(.62,'rgba(0,0,0,.55)'); r.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle = r; g.fillRect(-1,-1,2,2); g.restore();
      d.appendChild(c);
    };
    im.src = f.src; wadah.appendChild(d);
    return d;
  });
}
const at = (detik, fn) => setTimeout(fn, detik * 1000 * K);

async function jalankan(){
  if(document.fonts && document.fonts.ready) await Promise.race([document.fonts.ready, new Promise(r=>setTimeout(r,1500))]);
  $('sub').textContent = SUB;
  bangun(); ukurDanKecilkan();
  const foto = bangunFoto();

  judul.classList.add('mulai');                                   // kata masuk satu per satu
  at(T.warna, () => {
    $('putih').classList.add('hilang');
    setTimeout(() => judul.classList.add('putih'), 400*K);
    if(BG_BERGERAK) setTimeout(() => $('warna2').classList.add('hidup'), 2000*K);
  });
  foto.forEach((d,i) => at(FOTO[i].muncul, () => d.classList.add('tampil')));

  at(T.ringkas, () => {                                           // sisakan P-I-A-T (dan 12 RIAU)
    judul.querySelectorAll('.x').forEach((el,i)=>{
      el.style.transitionDelay = (i*45*K)+'ms'; el.classList.add('pergi');
    });
  });
  at(T.besar, () => { sk.style.transform = POSISI(1); });
  at(T.sub,   () => { $('subwrap').classList.add('naik'); });
  at(T.selesai, () => { kirim({type:'selesai'}); if(standalone) setTimeout(()=>location.reload(), 1500); });
}
jalankan();
</script>
</body>
</html>
