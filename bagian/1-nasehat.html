<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Nasehat & Dalil</title>
    <link rel="stylesheet" href="../aset/bagian.css" />
    <style>
      .area {
        display: grid;
        grid-template-columns: 1.85fr 1fr;
        gap: 26px;
      }
      .area.out > * {
        animation: keluar 0.6s cubic-bezier(0.5, 0, 0.8, 0.3) forwards;
      }
      .area > * {
        animation: masuk 1s cubic-bezier(0.2, 0.9, 0.25, 1) backwards;
      }
      .area > *:nth-child(2) {
        animation-delay: 0.18s;
      }

      /* kartu dalil */
      .dalil {
        padding: 34px 48px 30px;
        display: flex;
        flex-direction: column;
        --c: #34d399;
      }
      .dalil.hadits {
        --c: #fbbf24;
      }
      .baris-atas {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }
      .jenis {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        padding: 10px 26px 10px 18px;
        border-radius: 40px;
        background: rgba(255, 255, 255, 0.1);
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--c);
      }
      .jenis b {
        font-size: 30px;
        font-weight: 400;
        letter-spacing: 0;
      }
      .nomor {
        font-size: 24px;
        font-weight: 800;
        color: rgba(255, 255, 255, 0.4);
        font-variant-numeric: tabular-nums;
      }
      .arab-kotak {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 0;
        overflow: hidden;
        padding: 6px 0;
      }
      .arab {
        width: 100%;
        text-align: center;
        font-family: "Amiri", "Noto Naskh Arabic", "Traditional Arabic", serif;
        font-size: 80px;
        line-height: 1.85;
        font-weight: 700;
        color: #fff;
        text-shadow: 0 4px 30px rgba(0, 0, 0, 0.35);
      }
      .terjemah {
        font-size: 33px;
        line-height: 1.45;
        font-weight: 500;
        text-align: center;
        color: #e2e8f0;
        margin-bottom: 18px;
      }
      .sumber {
        align-self: center;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 10px 30px;
        border-radius: 40px;
        background: rgba(251, 191, 36, 0.14);
        border: 1.5px solid rgba(251, 191, 36, 0.45);
        color: #fde68a;
        font-size: 27px;
        font-weight: 700;
      }

      /* kartu nasehat */
      .nasehat {
        padding: 40px 42px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 22px;
        background: linear-gradient(
          160deg,
          rgba(52, 211, 153, 0.25),
          rgba(255, 255, 255, 0.05) 60%
        );
        --c: #34d399;
      }
      .ikon-besar {
        width: 104px;
        height: 104px;
        border-radius: 32px;
        background: var(--c);
        display: grid;
        place-items: center;
        font-size: 58px;
        box-shadow: 0 0 50px -6px var(--c);
        animation: goyang 4s ease-in-out infinite;
      }
      @keyframes goyang {
        0%,
        100% {
          transform: rotate(-6deg) translateY(0);
        }
        50% {
          transform: rotate(6deg) translateY(-8px);
        }
      }
      .label {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--c);
      }
      .isi-nasehat {
        font-size: 44px;
        line-height: 1.32;
        font-weight: 800;
        letter-spacing: -0.5px;
        overflow: hidden;
      }
      .penutup {
        font-size: 23px;
        color: var(--mut);
        font-weight: 600;
      }
    </style>
  </head>
