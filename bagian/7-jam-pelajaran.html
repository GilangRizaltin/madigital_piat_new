<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Jam Pelajaran</title>
    <link rel="stylesheet" href="../aset/bagian.css" />
    <style>
      .area {
        --accent: #f472b6;
      }
      .area.out > * {
        animation: keluar 0.6s cubic-bezier(0.5, 0, 0.8, 0.3) forwards;
      }

      /* ===== tabel jadwal (grid) ===== */
      .jadwal {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: 236px repeat(4, minmax(0, 1fr));
        column-gap: 6px;
        row-gap: 5px;
      }
      .jadwal > * {
        animation: rowIn 0.55s cubic-bezier(0.2, 0.9, 0.25, 1) backwards;
        animation-delay: calc(var(--r, 0) * 38ms);
      }
      @keyframes rowIn {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .hd {
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        font-weight: 800;
        font-size: 29px;
        letter-spacing: 0.04em;
        background: rgba(255, 255, 255, 0.1);
        border: 1.5px solid rgba(255, 255, 255, 0.14);
      }
      .hd.kelas {
        color: #0b1020;
      }
      .hd.k7 {
        background: #38bdf8;
      }
      .hd.k8 {
        background: #fbbf24;
      }
      .hd.sudut {
        font-size: 21px;
        letter-spacing: 0.2em;
        color: var(--mut);
        font-weight: 800;
      }

      /* kolom waktu */
      .wk {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 14px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.07);
        border: 1.5px solid rgba(255, 255, 255, 0.1);
      }
      .wk .no {
        flex: none;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--accent);
        color: #0b1020;
        font-size: 20px;
        font-weight: 800;
      }
      .wk .jam {
        font-size: 24px;
        font-weight: 700;
        color: #e2e8f0;
        letter-spacing: 0.01em;
        white-space: nowrap;
      }
      .wk.ekstra {
        justify-content: center;
        font-size: 21px;
        font-weight: 700;
        color: var(--mut);
        letter-spacing: 0.04em;
      }
      .wk.kini {
        background: #fff;
        border-color: #fff;
      }
      .wk.kini .jam {
        color: #0b1020;
      }
      .wk.kini .no {
        background: #0b1020;
        color: #fff;
      }

      /* pita istirahat / ishoma */
      .jeda {
        grid-column: 1/-1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        border-radius: 12px;
        background: linear-gradient(
          90deg,
          rgba(251, 113, 133, 0.05),
          rgba(251, 113, 133, 0.3) 20%,
          rgba(251, 113, 133, 0.3) 80%,
          rgba(251, 113, 133, 0.05)
        );
        font-size: 23px;
        font-weight: 800;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #fecdd3;
      }
      .jeda b {
        letter-spacing: 0.06em;
        font-weight: 700;
        color: #fff;
      }
      .jeda .e {
        font-family:
          "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
        font-size: 24px;
        letter-spacing: 0;
      }

      /* sel pelajaran */
      .sel {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 12px;
        border-radius: 14px;
        font-size: 27px;
        font-weight: 700;
        line-height: 1.1;
        color: #fff;
        background: rgba(var(--rgb), 0.32);
        border: 1.5px solid rgba(var(--rgb), 0.55);
        border-left: 7px solid rgb(var(--rgb));
      }
      .sel small {
        display: block;
        font-size: 19px;
        font-weight: 600;
        color: #cbd5e1;
        margin-top: 3px;
      }
      .sel.panjang {
        font-size: 29px;
      }
      .sel.kini {
        box-shadow: inset 0 0 0 3px #fff;
      }
      .sel.ekstra {
        background: rgba(163, 230, 53, 0.18);
        border: 1.5px solid rgba(163, 230, 53, 0.5);
        border-left: 7px solid #a3e635;
        font-size: 29px;
      }
      .sel.upacara {
        letter-spacing: 0.2em;
        text-transform: uppercase;
        font-size: 25px;
      }

      .ringan .sel.kini {
        box-shadow: inset 0 0 0 3px #fff;
      }
    </style>
  </head>

   • Sabtu sebelum JAM_SABTU_SEMUA  → jadwal Sabtu
   • Sabtu mulai JAM_SABTU_SEMUA    → SEMUA hari (Senin–Sabtu, pekan depan), sampai Minggu 23.59
   • Minggu                         → semua hari (pekan depan)
   Untuk uji coba, buka halaman ini dengan ?waktu=2026-11-14T14:30 */

      /* ---------------- kode tampilan (tidak perlu diubah) ---------------- */
      const { $, esc, pad, wait } = Mading;
      Mading.init({ warna: "#f472b6", judul: "Jam Pelajaran" });

      const BULAN = [
        "Januari",
        "Februari",
        "Maret",
        "April",
        "Mei",
        "Juni",
        "Juli",
        "Agustus",
        "September",
        "Oktober",
        "November",
        "Desember",
      ];
      const rgbDari = (nama) => {
        for (const k of KELOMPOK) if (k.daftar.indexOf(nama) >= 0) return k.rgb;
        return WARNA_LAIN;
      };
      const menit = (s) => {
        const m = /(\d\d)\.(\d\d)/.exec(s);
        return m ? +m[1] * 60 + +m[2] : 0;
      };

      /* waktu sekarang (boleh disimulasikan lewat ?waktu=YYYY-MM-DDTHH:MM) */
      function sekarang() {
        const q = new URLSearchParams(location.search).get("waktu");
        if (q) {
          const d = new Date(q);
          if (!isNaN(d)) return d;
        }
        return new Date();
      }

      /* tentukan hari apa yang ditampilkan */
      function tentukan() {
        const now = sekarang(),
          dow = now.getDay(); // 0 = Minggu
        const jam = now.getHours() + now.getMinutes() / 60;
        const semuaIdx = HARI.map((h, k) => k);
        if (dow === 0 || (dow === 6 && jam >= JAM_SABTU_SEMUA))
          return { semua: true, plus: 0, idx: semuaIdx };
        const plus = jam >= JAM_GANTI ? 1 : 0;
        const i = HARI.findIndex((h) => h.dow === dow + plus);
        return i < 0
          ? { semua: true, plus: 0, idx: semuaIdx }
          : { semua: false, plus, idx: [i] };
      }

      function tanggalHari(h, mode) {
        const now = sekarang(),
          dow = now.getDay();
        let selisih;
        if (mode.semua)
          selisih = (h.dow - dow + 7) % 7 || 7; // kemunculan berikutnya (pekan depan)
        else selisih = mode.plus;
        const d = new Date(
          now.getFullYear(),
          now.getMonth(),
          now.getDate() + selisih,
        );
        return {
          selisih,
          teks: d.getDate() + " " + BULAN[d.getMonth()] + " " + d.getFullYear(),
        };
      }

      function bangun(h) {
        const S = h.slot;
        const barisJP = {}; // JP -> nomor baris grid
        S.forEach((s, i) => {
          if (s.jp) barisJP[s.jp] = i + 2;
        });
        let html = "";
        /* header */
        html += `<div class="hd sudut" style="grid-row:1;grid-column:1;--r:0">JP · WAKTU</div>`;
        KELAS.forEach((k, c) => {
          html += `<div class="hd kelas ${k.indexOf("VIII") === 0 ? "k8" : "k7"}" style="grid-row:1;grid-column:${c + 2};--r:0">${esc(k)}</div>`;
        });
        /* kolom waktu + pita jeda */
        S.forEach((s, i) => {
          const r = i + 2;
          if (s.jeda) {
            html += `<div class="jeda" style="grid-row:${r};--r:${r}"><span class="e">${s.e || ""}</span><span>${esc(s.jeda)}</span><b>${esc(s.w.replace(" – ", "–"))}</b></div>`;
          } else {
            html += `<div class="wk" data-w="${esc(s.w)}" style="grid-row:${r};grid-column:1;--r:${r}"><span class="no">${s.jp}</span><span class="jam">${esc(s.w.replace(" – ", "–"))}</span></div>`;
          }
        });
        /* pelajaran */
        h.kelas.forEach((daftar, c) => {
          daftar.forEach((p) => {
            const a = barisJP[p[0]],
              b = barisJP[p[1]];
            if (!a || !b) return;
            const nama = p[2];
            const cls =
              "sel" +
              (p[1] - p[0] >= 1 ? " panjang" : "") +
              (nama === "Upacara" ? " upacara" : "");
            const rgb = nama === "Upacara" ? "244,244,245" : rgbDari(nama);
            html += `<div class="${cls}" data-a="${S[a - 2].w}" data-b="${S[b - 2].w}" style="grid-row:${a}/${b + 1};grid-column:${c + 2};--rgb:${rgb};--r:${a}">${esc(nama)}</div>`;
          });
        });
        /* kotak lintas kelas (mis. kokurikuler) */
        (h.gabung || []).forEach((g) => {
          const a = barisJP[g[0]];
          if (!a) return;
          html += `<div class="sel ekstra" data-a="${S[a - 2].w}" data-b="${S[a - 2].w}" style="grid-row:${a};grid-column:${g[1] + 1}/${g[2] + 2};--r:${a}"><div>${esc(g[3])}${g[4] ? `<small>${esc(g[4])}</small>` : ""}</div></div>`;
        });
        /* ekstrakurikuler */
        if (h.ekstra) {
          const r = S.length + 2;
          html += `<div class="wk ekstra" style="grid-row:${r};grid-column:1;--r:${r}">${esc(h.labelEkstra || "Ekstrakurikuler")}</div>`;
          h.ekstra.forEach((e) => {
            html += `<div class="sel ekstra" style="grid-row:${r};grid-column:${e[0] + 1}/${e[1] + 2};--r:${r}">${esc(e[2])}</div>`;
          });
        }
        /* tinggi baris */
        const rows = ["46px"].concat(
          S.map((s) => (s.jeda ? "36px" : "minmax(0,1fr)")),
        );
        if (h.ekstra) rows.push("54px");
        return `<div class="jadwal" id="jadwal" style="grid-template-rows:${rows.join(" ")}">${html}</div>`;
      }

      /* sorot jam yang sedang berlangsung (hanya untuk hari ini) */
      function sorotSekarang(aktifHariIni) {
        document
          .querySelectorAll(".kini")
          .forEach((e) => e.classList.remove("kini"));
        if (!aktifHariIni) return;
        const n = sekarang(),
          m = n.getHours() * 60 + n.getMinutes();
        document.querySelectorAll(".wk[data-w]").forEach((e) => {
          const p = e.dataset.w.split("–");
          if (m >= menit(p[0]) && m < menit(p[1])) e.classList.add("kini");
        });
        document.querySelectorAll(".sel[data-a]").forEach((e) => {
          const a = menit(e.dataset.a.split("–")[0]),
            b = menit(e.dataset.b.split("–")[1]);
          if (m >= a && m < b) e.classList.add("kini");
        });
      }

      Mading.mulai(async () => {
        const mode = tentukan(),
          urut = mode.idx;
        const detik = mode.semua ? WAKTU_PER_HARI : WAKTU_HARI_TUNGGAL;
        Mading.bar(urut.length * detik * 1000);
        const area = $("area");
        let timer = null;

        for (let n = 0; n < urut.length; n++) {
          const h = HARI[urut[n]],
            tg = tanggalHari(h, mode);
          const hariIni = !mode.semua && mode.plus === 0;
          area.classList.remove("out");
          $("title").classList.remove("out");
          Mading.judul({
            kicker:
              "Jam Pelajaran " +
              TAHUN_AJARAN +
              " · " +
              (mode.semua
                ? "Jadwal Pekan Depan · Hari " +
                  pad(n + 1) +
                  " / " +
                  pad(urut.length)
                : hariIni
                  ? "Jadwal Hari Ini"
                  : "Jadwal Besok"),
            judul: h.nama,
            sub:
              (hariIni ? "● Hari ini · " : tg.selisih === 1 ? "Besok · " : "") +
              tg.teks,
            arab: h.arab,
          });
          area.innerHTML = bangun(h);
          sorotSekarang(hariIni);
          clearInterval(timer);
          timer = setInterval(() => sorotSekarang(hariIni), 20000);
          await wait(detik * 1000 - 700);
          area.classList.add("out");
          $("title").classList.add("out");
          await wait(700);
        }
        clearInterval(timer);
        Mading.selesai();
      });
    </script>
  </body>
</html>
