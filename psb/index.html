<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PSB PIAT 12 Riau — Tayangan TV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ============================================================
   PSB PIAT 12 RIAU — halaman TV  (/psb/index.html)
   Warna tema diambil dari poster PSB.
   Animasi hanya opacity/transform (ringan untuk browser TV).
   ============================================================ */
      :root {
        --hijau-tua: #0a3d38;
        --hijau: #07604c;
        --hijau-terang: #159e64;
        --lime: #c9e85a;
        --lime-muda: #e2f59b;
        --daun: #b5d690;
        --biru: #143f63;
        --putih: #fff;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05231f;
        cursor: none;
      }
      body {
        font-family: "Poppins", "Segoe UI", Roboto, Arial, sans-serif;
        color: #fff;
      }

      /* kanvas 1920x1080 yang diskalakan otomatis */
      #stage {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        transform: translate(-50%, -50%) scale(1);
        transform-origin: 50% 50%;
        background:
          radial-gradient(
            900px 700px at 12% 8%,
            rgba(21, 158, 100, 0.55),
            transparent 70%
          ),
          radial-gradient(
            1000px 800px at 92% 96%,
            rgba(201, 232, 90, 0.16),
            transparent 70%
          ),
          linear-gradient(135deg, #0b7a58 0%, #07604c 40%, #0a3d38 100%);
      }
      /* hiasan bingkai bergaya poster (statis) */
      .hias {
        position: absolute;
        inset: 22px;
        border: 2px solid rgba(201, 232, 90, 0.28);
        border-radius: 6px;
        pointer-events: none;
      }
      .hias i {
        position: absolute;
        background: var(--lime);
        border-radius: 20px;
      }
      .hias .t {
        width: 14px;
        height: 14px;
        border-radius: 50%;
      }
      .hias .a {
        left: -8px;
        top: -8px;
      }
      .hias .b {
        right: -8px;
        top: -8px;
      }
      .hias .c {
        left: -8px;
        bottom: -8px;
      }
      .hias .d {
        right: -8px;
        bottom: -8px;
      }
      .hias .m1 {
        width: 64px;
        height: 10px;
        left: 50%;
        top: -6px;
        margin-left: -32px;
      }
      .hias .m2 {
        width: 64px;
        height: 10px;
        left: 50%;
        bottom: -6px;
        margin-left: -32px;
      }
      .hias .m3 {
        width: 10px;
        height: 64px;
        left: -6px;
        top: 50%;
        margin-top: -32px;
      }
      .hias .m4 {
        width: 10px;
        height: 64px;
        right: -6px;
        top: 50%;
        margin-top: -32px;
      }

      /* ---------- segmen ---------- */
      .seg {
        position: absolute;
        inset: 0;
        opacity: 0;
        visibility: hidden;
      }
      .seg.on {
        opacity: 1;
        visibility: visible;
      }

      video {
        background: #000;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      /* bingkai video */
      .bingkai {
        position: absolute;
        padding: 8px;
        border-radius: 30px;
        background: linear-gradient(
          135deg,
          var(--lime),
          var(--hijau-terang) 55%,
          var(--lime-muda)
        );
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      }
      .bingkai .isi {
        width: 100%;
        height: 100%;
        border-radius: 23px;
        overflow: hidden;
        background: #000;
      }

      /* --- segmen 1: landscape hampir penuh --- */
      #s-profil .bingkai {
        left: 64px;
        top: 36px;
        width: 1792px;
        height: 1008px;
      }
      .cip {
        position: absolute;
        z-index: 3;
        height: 46px;
        padding: 0 26px;
        border-radius: 30px;
        display: flex;
        align-items: center;
        font-weight: 700;
        font-size: 22px;
        letter-spacing: 0.06em;
        white-space: nowrap;
      }
      .cip.lime {
        background: var(--lime);
        color: #073b33;
      }
      .cip.gelap {
        background: #073b33;
        color: var(--lime);
        border: 2px solid var(--lime);
      }
      #s-profil .cip.kiri {
        left: 120px;
        bottom: 12px;
      }
      #s-profil .cip.kanan {
        right: 120px;
        bottom: 12px;
      }

      /* --- segmen portrait + kesimpulan --- */
      .p .bingkai {
        left: 92px;
        top: 52px;
        width: 556px;
        height: 976px;
      }
      .panel {
        position: absolute;
        left: 716px;
        top: 56px;
        width: 1108px;
        height: 960px;
        display: flex;
        flex-direction: column;
      }
      .tag {
        align-self: flex-start;
        height: 50px;
        padding: 0 28px;
        border-radius: 30px;
        background: var(--lime);
        color: #073b33;
        font-weight: 800;
        font-size: 24px;
        letter-spacing: 0.12em;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .tag b {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #07604c;
        display: block;
      }
      .panel h2 {
        margin-top: 22px;
        font-size: 68px;
        line-height: 1.08;
        font-weight: 800;
        color: var(--lime);
        letter-spacing: -0.01em;
      }
      .panel .siapa {
        margin-top: 10px;
        font-size: 32px;
        font-weight: 600;
        color: var(--daun);
      }
      .label {
        margin-top: 20px;
        display: flex;
        align-items: center;
        gap: 22px;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.2em;
        color: #fff;
      }
      .label::after {
        content: "";
        flex: 1;
        height: 3px;
        background: linear-gradient(90deg, var(--lime), rgba(201, 232, 90, 0));
      }
      .poin {
        list-style: none;
        margin-top: 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .poin li {
        display: flex;
        gap: 22px;
        align-items: flex-start;
        padding: 10px 24px 10px 14px;
        border-radius: 20px;
        background: rgba(4, 40, 35, 0.55);
        border: 2px solid rgba(201, 232, 90, 0.25);
        opacity: 0;
        transform: translateX(40px);
        transition:
          opacity 0.6s ease,
          transform 0.6s ease;
      }
      .poin li.tampil {
        opacity: 1;
        transform: none;
      }
      .poin li.lama {
        opacity: 0.62;
      }
      .poin .no {
        flex: none;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--lime);
        color: #073b33;
        font-weight: 800;
        font-size: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .poin .tx {
        font-size: 29px;
        line-height: 1.3;
        font-weight: 600;
        padding-top: 2px;
      }
      .poin .tx em {
        font-style: normal;
        color: var(--lime);
      }
      .alamat {
        margin-top: 20px;
        padding: 16px 26px;
        border-radius: 20px;
        background: var(--lime);
        color: #073b33;
        font-size: 28px;
        line-height: 1.3;
        font-weight: 700;
        display: flex;
        gap: 18px;
        align-items: center;
      }
      .alamat span {
        font-size: 40px;
      }

      /* kaki halaman (indikator segmen + progres) */
      #kaki {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 46px;
        z-index: 6;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 92px 6px;
        font-size: 22px;
        font-weight: 600;
        color: var(--daun);
      }
      #titik {
        display: flex;
        gap: 12px;
      }
      #titik i {
        width: 14px;
        height: 14px;
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.28);
        display: block;
      }
      #titik i.on {
        background: var(--lime);
        width: 44px;
      }
      #progres {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 6px;
        width: 100%;
        background: var(--lime);
        transform-origin: 0 50%;
        transform: scaleX(0);
        z-index: 7;
        transition: transform 0.5s linear;
      }
      .hide-kaki #kaki {
        opacity: 0;
      }

      /* --- segmen poster --- */
      #s-poster .poster {
        position: absolute;
        left: 120px;
        top: 44px;
        width: 733px;
        height: 1000px;
        border-radius: 26px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        border: 6px solid var(--lime);
        object-fit: cover;
        background: #07604c;
      }
      #s-poster .kanan {
        position: absolute;
        left: 930px;
        top: 44px;
        width: 880px;
        height: 1000px;
        display: flex;
        flex-direction: column;
      }
      .kanan .head {
        margin-top: 20px;
        font-size: 72px;
        line-height: 1.06;
        font-weight: 800;
        color: #fff;
      }
      .kanan .head span {
        display: block;
        color: var(--lime);
      }
      .diskon {
        margin-top: 26px;
        position: relative;
        border-radius: 34px;
        padding: 22px 40px 24px;
        background: linear-gradient(
          135deg,
          var(--lime-muda),
          var(--lime) 60%,
          #a9d63f
        );
        color: #073b33;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.4);
        transform-origin: 50% 50%;
      }
      .diskon .k {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.14em;
      }
      .diskon .n {
        font-size: 112px;
        line-height: 1.02;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .diskon .n small {
        font-size: 54px;
        font-weight: 800;
        margin-right: 8px;
        letter-spacing: 0;
      }
      .diskon .s {
        font-size: 31px;
        font-weight: 700;
        margin-top: 4px;
      }
      .daftar {
        margin-top: 26px;
        display: flex;
        gap: 30px;
        align-items: center;
      }
      .qr {
        flex: none;
        width: 210px;
        height: 210px;
        padding: 16px;
        background: #fff;
        border-radius: 24px;
        border: 5px solid var(--lime);
      }
      .qr svg {
        display: block;
        width: 100%;
        height: 100%;
        fill: #07261f;
      }
      .daftar .tx .a {
        font-size: 30px;
        font-weight: 600;
        color: var(--daun);
      }
      .daftar .tx .u {
        margin-top: 10px;
        display: inline-block;
        font-size: 33px;
        font-weight: 700;
        color: #073b33;
        background: var(--lime);
        padding: 12px 28px;
        border-radius: 40px;
      }
      .daftar .tx .i {
        margin-top: 14px;
        font-size: 27px;
        font-weight: 600;
        color: #fff;
      }
      .jadwal {
        margin-top: auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .jadwal div {
        background: rgba(20, 63, 99, 0.78);
        border: 2px solid rgba(201, 232, 90, 0.35);
        border-radius: 18px;
        padding: 8px 16px;
        font-size: 21px;
        font-weight: 500;
        line-height: 1.25;
      }
      .jadwal b {
        display: block;
        font-size: 24px;
        font-weight: 700;
        color: var(--lime);
      }
      #s-poster .cta,
      .denyut {
        animation: denyut 2.2s ease-in-out infinite;
      }
      @keyframes denyut {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.035);
        }
      }

      /* ============ TRANSISI TEKS ============ */
      #trans {
        position: absolute;
        inset: 0;
        z-index: 20;
        visibility: hidden;
        overflow: hidden;
        background: linear-gradient(
          135deg,
          #0b7a58 0%,
          #07604c 45%,
          #082f2c 100%
        );
        transform: translateX(100%);
      }
      #trans.aktif {
        visibility: visible;
      }
      #trans.masuk {
        transform: translateX(0);
        transition: transform 0.55s cubic-bezier(0.7, 0, 0.25, 1);
      }
      #trans.keluar {
        transform: translateX(-100%);
        transition: transform 0.6s cubic-bezier(0.7, 0, 0.25, 1);
      }
      #trans .pita {
        position: absolute;
        left: -300px;
        width: 2500px;
        height: 70px;
        background: var(--lime);
        opacity: 0.9;
        transform: translateX(-100%) rotate(-12deg);
      }
      #trans .pita.b {
        height: 26px;
        background: var(--hijau-terang);
        opacity: 1;
      }
      #trans.teks .pita {
        transform: translateX(0) rotate(-12deg);
        transition: transform 1.1s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      #trans .pita.p1 {
        top: 140px;
      }
      #trans .pita.p2 {
        top: 260px;
        transition-delay: 0.12s;
      }
      #trans .pita.p3 {
        top: 790px;
        transition-delay: 0.08s;
      }
      #trans .pita.p4 {
        top: 930px;
        transition-delay: 0.2s;
      }
      #trans .tengah {
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        text-align: center;
      }
      #trans .baris {
        overflow: hidden;
        padding: 0.06em 0;
        line-height: 1.08;
      }
      #trans .baris span {
        display: inline-block;
        transform: translateY(115%);
        font-weight: 800;
        letter-spacing: 0.03em;
      }
      #trans .b1 span {
        font-size: 96px;
        color: #fff;
      }
      #trans .b2 span {
        font-size: 96px;
        color: #fff;
      }
      #trans .b3 span {
        font-size: 190px;
        color: var(--lime);
        letter-spacing: 0.04em;
        line-height: 1.02;
      }
      #trans.teks .baris span {
        transform: none;
        transition: transform 0.75s cubic-bezier(0.2, 0.9, 0.2, 1);
      }
      #trans.teks .b1 span {
        transition-delay: 0.05s;
      }
      #trans.teks .b2 span {
        transition-delay: 0.2s;
      }
      #trans.teks .b3 span {
        transition-delay: 0.38s;
      }
      #trans .garis {
        width: 880px;
        height: 8px;
        margin: 20px auto 0;
        border-radius: 4px;
        background: var(--lime);
        transform: scaleX(0);
      }
      #trans.teks .garis {
        transform: scaleX(1);
        transition: transform 0.8s cubic-bezier(0.5, 0, 0.1, 1) 0.6s;
      }
      #trans .sub {
        margin-top: 28px;
        font-size: 38px;
        font-weight: 600;
        letter-spacing: 0.28em;
        color: var(--lime-muda);
        opacity: 0;
        transform: translateY(24px);
      }
      #trans.teks .sub {
        opacity: 1;
        transform: none;
        transition:
          opacity 0.6s ease 0.95s,
          transform 0.6s ease 0.95s;
      }
      #trans .next {
        position: absolute;
        left: 50%;
        bottom: 70px;
        transform: translateX(-50%);
        white-space: nowrap;
        padding: 12px 38px;
        border-radius: 40px;
        background: #06342f;
        border: 2px solid rgba(201, 232, 90, 0.5);
        font-size: 30px;
        font-weight: 600;
        color: var(--daun);
        opacity: 0;
      }
      #trans.teks .next {
        opacity: 1;
        transition: opacity 0.6s ease 1.15s;
      }
      #trans .next b {
        color: #fff;
      }

      /* petunjuk suara / pesan */
      #bisu {
        position: absolute;
        right: 48px;
        top: 40px;
        z-index: 30;
        padding: 14px 28px;
        border-radius: 30px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font-size: 28px;
        font-weight: 600;
        display: none;
      }
      #bisu.tampak {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div class="hias">
        <i class="t a"></i><i class="t b"></i><i class="t c"></i
        ><i class="t d"></i><i class="m1"></i><i class="m2"></i
        ><i class="m3"></i><i class="m4"></i>
      </div>

      <!-- 1. PROFIL (landscape) -->
      <section class="seg" id="s-profil">
        <div class="bingkai">
          <div class="isi"><video playsinline preload="auto"></video></div>
        </div>
        <div class="cip lime kiri" id="p-kiri"></div>
        <div class="cip gelap kanan" id="p-kanan"></div>
      </section>

      <!-- 2-4. PORTRAIT + KESIMPULAN (diisi dari DATA lewat JS) -->
      <section class="seg p" id="s-eko"></section>
      <section class="seg p" id="s-sabiq"></section>
      <section class="seg p" id="s-ocu"></section>

      <!-- 5. POSTER -->
      <section class="seg" id="s-poster">
        <img class="poster" id="poster-img" alt="Poster PSB" />
        <div class="kanan">
          <div class="tag"><b></b><span id="po-tag"></span></div>
          <div class="head" id="po-head"></div>
          <div class="diskon denyut">
            <div class="k" id="po-dk"></div>
            <div class="n"><small>Rp</small><span id="po-dn"></span></div>
            <div class="s" id="po-ds"></div>
          </div>
          <div class="daftar">
            <div class="qr">
              <svg viewBox="0 0 29 29" shape-rendering="crispEdges">
                <path

      /* titik indikator */
      $("#titik").innerHTML = SEGMEN.map(() => "<i></i>").join("");
      const titik = [...document.querySelectorAll("#titik i")];

      /* --- pemutar --- */
      const trans = $("#trans"),
        progres = $("#progres"),
        bisu = $("#bisu");
      let idx = -1,
        aktif = null,
        timer = null,
        jaga = null,
        jaga2 = null,
        sudahSuara = !SUARA,
        gerak = false;

      const tunggu = (ms) => new Promise((r) => setTimeout(r, ms));

      function videoDari(seg) {
        const v = document.querySelector("#" + seg.id + " video");
        return v;
      }

      function lepas(seg) {
        if (!seg || seg.tipe !== "video") return;
        const v = videoDari(seg);
        if (v) {
          v.onended = v.onerror = v.ontimeupdate = v.onplaying = null;
          v.pause();
          v.removeAttribute("src");
          v.load();
        }
      }

      function setProgres(x) {
        progres.style.transform = "scaleX(" + Math.max(0, Math.min(1, x)) + ")";
      }

      async function mainkanVideo(seg) {
        const v = videoDari(seg);
        const items = [
          ...document.querySelectorAll("#" + seg.id + " .poin li"),
        ];
        items.forEach((li) => (li.className = ""));
        let selesai = false,
          mulaiMain = false,
          jaga2 = null;
        const akhir = () => {
          if (selesai || aktif !== seg) return;
          selesai = true;
          clearTimeout(jaga);
          clearTimeout(jaga2);
          lanjut();
        };

        v.onended = akhir;
        v.onerror = () => {
          console.warn("Video gagal dimuat, dilewati:", seg.file);
          akhir();
        };
        v.onplaying = () => {
          mulaiMain = true;
        };
        v.ontimeupdate = () => {
          const t = v.currentTime,
            d = v.duration || 1;
          setProgres(t / d);
          let n = -1;
          items.forEach((li, i) => {
            if (t >= seg.poin?.[i]?.mulai) n = i;
          });
          items.forEach((li, i) => {
            li.className = i < n ? "tampil lama" : i === n ? "tampil" : "";
          });
        };
        jaga = setTimeout(akhir, seg.maks * 1000); // batas aman
        jaga2 = setTimeout(() => {
          if (!mulaiMain) akhir();
        }, 12000); // tak kunjung main → lewati

        v.volume = VOLUME;
        v.muted = !SUARA; // coba langsung bersuara
        let p = v.play();
        const cekBisu = () => {
          if (SUARA && v.muted) bisu.classList.add("tampak");
          else bisu.classList.remove("tampak");
        };
        if (p && p.catch)
          p.catch(() => {
            // diblokir browser → putar tanpa suara + petunjuk
            v.muted = true;
            const q = v.play();
            if (q && q.catch) q.catch(() => {});
            cekBisu();
          });
        setTimeout(cekBisu, 1500);
      }

      function tampilkan(seg) {
        document
          .querySelectorAll(".seg")
          .forEach((e) => e.classList.remove("on"));
        $("#" + seg.id).classList.add("on");
        if (seg.tipe !== "video") bisu.classList.remove("tampak");
        titik.forEach((t, i) => t.classList.toggle("on", i === idx));
        $("#kaki").style.display = seg.id === "s-profil" ? "none" : "";
        setProgres(0);
      }

      async function transisi(segBerikut, siapkan) {
        const dur = TRANSISI.durasi;
        $("#t-next").innerHTML = "Berikutnya: <b>" + segBerikut.label + "</b>";
        trans.className = "aktif";
        void trans.offsetWidth;
        trans.classList.add("masuk");
        await tunggu(560);
        trans.classList.add("teks");
        siapkan(); // ganti segmen saat tertutup
        await tunggu(dur - 560 - 620);
        trans.classList.remove("masuk");
        trans.classList.add("keluar");
        return tunggu(620).then(() => {
          trans.className = "";
        });
      }

      async function lanjut() {
        if (gerak) return;
        gerak = true;
        clearTimeout(timer);
        clearTimeout(jaga);
        const lama = aktif;
        idx = (idx + 1) % SEGMEN.length;
        const seg = SEGMEN[idx];
        // siapkan (muat) video berikutnya selama transisi
        if (seg.tipe === "video") {
          const v = videoDari(seg);
          v.preload = "auto";
          v.src = seg.file;
          v.load();
        }
        await transisi(seg, () => {
          tampilkan(seg);
          lepas(lama);
        });
        aktif = seg;
        gerak = false;
        if (seg.tipe === "video") mainkanVideo(seg);
        else {
          let t0 = performance.now(),
            total = seg.durasi * 1000;
          const tik = () => {
            if (aktif !== seg) return;
            const x = (performance.now() - t0) / total;
            setProgres(x);
            if (x < 1) setTimeout(tik, 500);
          };
          tik();
          timer = setTimeout(lanjut, total);
        }
      }

      /* --- kontrol remote / keyboard --- */
      function nyalakanSuara() {
        if (!SUARA) return;
        sudahSuara = true;
        const v = aktif && aktif.tipe === "video" ? videoDari(aktif) : null;
        if (v && v.muted) {
          v.muted = false;
          v.volume = VOLUME;
          const p = v.play();
          if (p && p.catch) p.catch(() => {});
        }
        if (!v || !v.muted) bisu.classList.remove("tampak");
      }
      ["click", "mousedown", "pointerdown", "touchstart", "keyup"].forEach(
        (n) => addEventListener(n, nyalakanSuara, true),
      );
      addEventListener("keydown", (e) => {
        nyalakanSuara();
        const k = e.key;
        if (k === "ArrowRight" || k === "PageDown") {
          if (aktif) {
            lepas(aktif);
            lanjut();
          }
        } else if (k === "ArrowLeft" || k === "PageUp") {
          if (aktif) {
            lepas(aktif);
            idx = (idx - 2 + SEGMEN.length) % SEGMEN.length;
            lanjut();
          }
        } else if (k === "f" || k === "F" || k === "Enter") {
          const d = document.documentElement;
          if (!document.fullscreenElement)
            (
              d.requestFullscreen ||
              d.webkitRequestFullscreen ||
              (() => {})
            ).call(d);
          else
            (
              document.exitFullscreen ||
              document.webkitExitFullscreen ||
              (() => {})
            ).call(document);
        } else if (k === "m" || k === "M") {
          const v = aktif && aktif.tipe === "video" ? videoDari(aktif) : null;
          if (v) v.muted = !v.muted;
        }
      });

      /* mulai — tunggu font siap agar teks transisi tidak melompat */
      (document.fonts && document.fonts.ready
        ? document.fonts.ready
        : Promise.resolve()
      ).then(() => setTimeout(lanjut, 300));
    </script>
  </body>
</html>
